services:

  client:
    container_name: client
    image: client
    ports:
      - 4200:80
    depends_on:
      - server
    healthcheck:
      test: wget localhost:4200/api -q -O - > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  server:
    container_name: server
    image: server
    ports:
      - 3000:3333
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - DATABASE_HOST=={DB_HOST}
      # - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    healthcheck:
      # test: wget localhost:3000/api/health -q -O - > /dev/null 2>&1
      test: curl --silent --fail localhost:3333/api/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - pgadmin
      - adminer

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: douglas@localhost.com
      PGADMIN_DEFAULT_PASSWORD: pgAdmin4CanDoIt

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
