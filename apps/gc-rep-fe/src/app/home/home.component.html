<div class="p-4">
    <div class="top-4 m-4">
        <div
            class="bg-inherit dark:bg-inherit text-inherit dark:text-white p-4">
            <button type="button"
                class="text-white bg-blue-700 hover:bg-blue-500 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
                (click)="updateData()">Refresh general information</button>

            <section>
                <div class="flex flex-row pt-4">
                    <div class="basis-2/3">
                        <p class="pb-4">Total Competions: {{noOfCompsInDb$ |
                            async}}</p>
                        <p class="pb-4">Total known members: {{noOfMemersInDb$ |
                            async}}</p>
                        <p class="pb-4">Number of Competions to Review:
                            {{noOfCompsToReview$ | async}}</p>
                    </div>
                </div>
            </section>
        </div>
        <section>
            <div class="flex flex-row gap-16 pt-4">
                <div class="basis-1/3">
                    <h2 class="text-xl font-bold dark:text-white pt-2 pb-2">
                        Finalised Competions</h2>
                    <table id="finalisedComp">
                        ...
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>
