<div class="p-4">
    <input type="file" class="hidden" accept=".csv" (change)="onChange($event)"
        #fileUpload />
    <div class="top-4 m-4">
        <div
            class="bg-inherit dark:bg-inherit text-inherit dark:text-white p-4">
            <button type="button"
                class="text-white bg-blue-700 hover:bg-blue-500 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
                (click)="fileUpload.click()">Select Competition to
                import</button>
        </div>
    </div>

    <section>
        {{fileName}}<br>
        @if(response$ | async; as response) {
        @for(message of response.body; track $index) {
        <li>{{message}}</li>
        }
        }
    </section>
</div>
